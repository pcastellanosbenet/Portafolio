name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  traffic-signs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traffic-signs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: traffic-signs/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q

  bert-attention:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bert-attention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bert-attention/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q

  rag-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag-assistant/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts app
      - name: Test
        run: pytest -q
