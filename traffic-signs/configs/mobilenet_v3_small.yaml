seed: 42

data:
  root: data
  image_size: 96
  val_fraction: 0.15
  num_workers: 2
  batch_size: 64

model:
  name: mobilenet_v3_small
  dropout: 0.2
  pretrained: true
  freeze_backbone: true

training:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  patience: 4
  class_weights: true

output:
  run_name: mobilenet_v3_small
  results_dir: results
  checkpoint_dir: checkpoints

threads: 2
