seed: 42

data:
  root: data
  image_size: 24
  val_fraction: 0.15
  num_workers: 2
  batch_size: 128

model:
  name: small_cnn
  dropout: 0.3
  pretrained: false
  freeze_backbone: false

training:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  patience: 6
  class_weights: true

output:
  run_name: baseline
  results_dir: results
  checkpoint_dir: checkpoints

threads: 2
