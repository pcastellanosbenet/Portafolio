services:
  docs-mcp:
    build: .
    command: ["python", "-m", "src.upstreams.docs.server"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8766
    ports:
      - "8766:8766"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ops-mcp:
    build: .
    command: ["python", "-m", "src.upstreams.ops.server"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8767
    ports:
      - "8767:8767"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8767/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    command: ["python", "-m", "src", "--transport", "http"]
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8765
      GATEWAY_PUBLIC_URL: http://127.0.0.1:8765/mcp
      GATEWAY_ALLOWED_ORIGINS: http://127.0.0.1:8765,http://localhost:8765
      GATEWAY_UPSTREAMS: docs,research,ops
      GATEWAY_APPROVAL_MODE: risk
      GATEWAY_DB_PATH: /app/artifacts/gateway.db
      DOCS_MCP_URL: http://docs-mcp:8766/mcp
      OPS_MCP_URL: http://ops-mcp:8767/mcp
      RESEARCH_MCP_COMMAND: python -m src.upstreams.research.server
      RESEARCH_MODE: fixtures
    ports:
      - "8765:8765"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      docs-mcp:
        condition: service_healthy
      ops-mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
